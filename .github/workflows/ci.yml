name: CI

on:
  pull_request:
  push:
    branches: ["main"]
    tags: ["v*"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Run checks
        run: |
          uv run --with ruff --with aiohttp ruff check .
          uv run --with pytest --with aiohttp pytest -q
          python -m compileall -q custom_components tests

  release:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref }}
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify tag and package integration
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import tomllib
          from pathlib import Path

          tag = os.environ["RELEASE_TAG"]
          manifest = json.loads(
              Path("custom_components/broadair/manifest.json").read_text()
          )
          project = tomllib.loads(Path("pyproject.toml").read_text())["project"]
          if not re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+", tag):
              raise SystemExit(f"Expected a stable version tag, got {tag}")
          if not (tag[1:] == manifest["version"] == project["version"]):
              raise SystemExit("Tag, manifest and project versions must match")
          PY

          git archive --format=zip --output="broadair-${RELEASE_TAG}.zip" \
            HEAD custom_components/broadair
          unzip -tq "broadair-${RELEASE_TAG}.zip"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" "broadair-${RELEASE_TAG}.zip" \
            --verify-tag --generate-notes
