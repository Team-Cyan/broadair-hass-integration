name: CI

on:
  pull_request:
  push:
    branches: ["main"]
    tags: ["v*"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Run checks
        run: |
          uv run --with ruff --with aiohttp ruff check .
          uv run --with pytest --with aiohttp pytest -q
          python -m compileall -q custom_components tests
